name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the Playwright visual baselines with CI's Chromium and upload them
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.SITE_URL || 'https://calculadoras.example' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Point Lighthouse at Playwright's Chromium
        run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots }}
        run: |
          npm run build
          npx playwright test visual.spec.ts --update-snapshots
      - name: Upload visual baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__/

      - name: Quality gate
        if: ${{ !inputs.update_snapshots }}
        run: npm run check

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
